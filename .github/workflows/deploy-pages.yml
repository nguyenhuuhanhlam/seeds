name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: timekeeping/package-lock.json
      # Mỗi app nằm trong thư mục riêng; build với base là subpath Pages của app đó
      - run: npm ci
        working-directory: timekeeping
      - run: npm run build -- --base=/seeds/timekeeping/
        working-directory: timekeeping
      # Ghép các app + trang chủ ở root thành một site duy nhất
      - run: |
          mkdir -p _site/timekeeping
          cp -r timekeeping/dist/* _site/timekeeping/
          cp index.html _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true # tự bật Pages (build type workflow) nếu repo chưa bật
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
